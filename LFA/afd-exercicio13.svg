<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="740" height="380" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="740" height="380" fill="#ffffff"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14335c"/>
    </marker>
  </defs>

  <g stroke="#14335c" stroke-width="2" fill="none">
    <!-- seta de inicio -->
    <line x1="14" y1="200" x2="46" y2="200" marker-end="url(#seta)"/>

    <!-- estados -->
    <circle cx="80"  cy="200" r="30" fill="#ffffff"/>
    <circle cx="220" cy="200" r="30" fill="#ffffff"/>
    <circle cx="360" cy="200" r="30" fill="#ffffff"/>
    <circle cx="500" cy="200" r="30" fill="#ffffff"/>
    <circle cx="640" cy="200" r="30" fill="#ffffff"/>
    <circle cx="640" cy="200" r="24" fill="none"/>

    <!-- transicoes m25 (linha reta) -->
    <line x1="110" y1="200" x2="184" y2="200" marker-end="url(#seta)"/>
    <line x1="250" y1="200" x2="324" y2="200" marker-end="url(#seta)"/>
    <line x1="390" y1="200" x2="464" y2="200" marker-end="url(#seta)"/>
    <line x1="530" y1="200" x2="604" y2="200" marker-end="url(#seta)"/>

    <!-- transicoes m50 (arcos) -->
    <path d="M 101 179 Q 220 88 337 175" marker-end="url(#seta)"/>
    <path d="M 381 179 Q 500 88 617 175" marker-end="url(#seta)"/>
    <path d="M 241 221 Q 360 312 477 225" marker-end="url(#seta)"/>

    <!-- laco em q100 -->
    <path d="M 622 175 C 600 118 680 118 658 175" marker-end="url(#seta)"/>
  </g>

  <g fill="#14335c" font-size="17" text-anchor="middle">
    <text x="80"  y="206">q0</text>
    <text x="220" y="206">q25</text>
    <text x="360" y="206">q50</text>
    <text x="500" y="206">q75</text>
    <text x="640" y="206">q100</text>
  </g>

  <g fill="#8a3b12" font-size="15" text-anchor="middle" font-style="italic">
    <!-- rotulos m25 -->
    <text x="147" y="192">m25</text>
    <text x="287" y="192">m25</text>
    <text x="427" y="192">m25</text>
    <text x="567" y="192">m25, m50</text>
    <!-- rotulos m50 -->
    <text x="220" y="120">m50</text>
    <text x="500" y="120">m50</text>
    <text x="360" y="296">m50</text>
    <!-- laco -->
    <text x="640" y="122">m25, m50</text>
  </g>

  <g fill="#14335c" font-size="14" text-anchor="middle">
    <text x="80"  y="256">R$ 0,00</text>
    <text x="220" y="256">R$ 0,25</text>
    <text x="360" y="256">R$ 0,50</text>
    <text x="500" y="256">R$ 0,75</text>
    <text x="640" y="256">R$ 1,00</text>
    <text x="640" y="274" font-style="italic">(libera o produto)</text>
  </g>

  <text x="370" y="350" fill="#14335c" font-size="15" text-anchor="middle">AFD — Máquina de vendas (produto de R$ 1,00, sem troco)</text>
</svg>
